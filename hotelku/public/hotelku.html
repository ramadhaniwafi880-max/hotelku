<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HotelKu: cari kamar di dua hotel sekaligus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mist:#EAF1F0; --paper:#FFFFFF; --ink:#0E2A35; --muted:#5B7480;
  --lagoon:#1F7A8C; --lagoon-d:#16596A; --amber:#B8751A; --line:#CBDAD8; --err:#B3261E; --ok:#1B7A4B;
  --head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--mist);color:var(--ink);font:400 16px/1.55 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{padding:18px 0}
.brand{font:800 22px var(--head);letter-spacing:-.02em}
.brand span{color:var(--lagoon)}
.hero{padding:28px 0 36px}
h1{font:800 clamp(34px,6vw,58px)/1.02 var(--head);letter-spacing:-.03em;margin:0 0 12px;max-width:14em}
.lead{margin:0 0 28px;color:var(--muted);max-width:34em}

/* strip pencarian: bentuk tiket dengan garis putus-putus */
.ticket{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;background:var(--paper);border-radius:18px;box-shadow:0 10px 30px -12px rgba(14,42,53,.35);overflow:hidden}
.ticket .f{padding:14px 20px;border-right:2px dashed var(--line);display:flex;flex-direction:column;gap:2px}
.ticket label{font-size:13px;font-weight:600;color:var(--muted)}
.ticket select,.ticket input{border:0;background:transparent;font:600 17px var(--body);color:var(--ink);padding:4px 0;width:100%}
.ticket select:focus,.ticket input:focus{outline:none}
.ticket .f:focus-within{background:#F3F8F7}
.go{border:0;background:var(--lagoon);color:#fff;font:600 17px var(--body);padding:0 32px;cursor:pointer}
.go:hover{background:var(--lagoon-d)}
.go:disabled{opacity:.6;cursor:wait}

.status{margin:18px 0 0;min-height:24px;font-size:15px;color:var(--muted)}
.status.warn{color:var(--amber);font-weight:600}
.status.bad{color:var(--err);font-weight:600}

h2{font:800 26px var(--head);letter-spacing:-.02em;margin:0}
.sec{padding:8px 0 40px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.count{color:var(--muted);font-size:15px}

.rooms{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:16px;overflow:hidden}
.room{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 20px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.room:last-child{border-bottom:0}
.tag{font:800 15px var(--head);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--lagoon)}
.tag.b{background:var(--amber)}
.room h3{margin:0;font:600 18px var(--body)}
.meta{color:var(--muted);font-size:14px}
.price{text-align:right;line-height:1.3}
.price strong{font:800 19px var(--head);display:block}
.price small{color:var(--muted);font-size:13px}
.btn{border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 15px var(--body);padding:9px 18px;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--ink);color:#fff}
.btn.solid{background:var(--lagoon);border-color:var(--lagoon);color:#fff}
.btn.solid:hover{background:var(--lagoon-d);border-color:var(--lagoon-d)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger:hover{background:var(--err);color:#fff}
.empty{padding:36px 22px;color:var(--muted);text-align:center}

.mine{background:var(--paper);border-radius:16px;padding:22px}
.lookup{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.lookup input,dialog input{font:500 16px var(--body);padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.lookup input{width:200px}
.lookup input:focus,dialog input:focus{border-color:var(--lagoon);outline:none}
.bk{border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.bk dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:15px}
.bk dt{color:var(--muted)}
.bk dd{margin:0;font-weight:600}

dialog{border:0;border-radius:18px;padding:0;width:min(460px,92vw);color:var(--ink);box-shadow:0 30px 80px -20px rgba(14,42,53,.6)}
dialog::backdrop{background:rgba(14,42,53,.55)}
dialog form,dialog .done{padding:24px}
dialog h2{font-size:22px;margin-bottom:4px}
.sum{color:var(--muted);font-size:15px;margin:0 0 16px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);padding-top:12px;margin:6px 0 16px}
.total strong{font:800 22px var(--head)}
.err{color:var(--err);font-weight:600;font-size:14px;min-height:20px;margin:0 0 10px;white-space:pre-line}
.acts{display:flex;gap:10px;justify-content:flex-end}
.ok{color:var(--ok)}
footer{padding:20px 0 40px;color:var(--muted);font-size:14px}

@media (max-width:820px){
  .ticket{grid-template-columns:1fr 1fr}
  .ticket .f:first-child{grid-column:1/-1}
  .ticket .f{border-bottom:2px dashed var(--line)}
  .go{grid-column:1/-1;padding:16px}
  .room{grid-template-columns:auto 1fr;}
  .price{text-align:left;grid-column:2}
  .room .btn{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">Hotel<span>Ku</span></div></div></header>

<main>
<section class="hero"><div class="wrap">
  <h1>Dua hotel, satu pencarian.</h1>
  <p class="lead">HotelKu mengecek kamar kosong di Hotel A dan Hotel B sekaligus, lalu meneruskan pesananmu ke hotel yang dipilih.</p>

  <form class="ticket" id="searchForm">
    <div class="f"><label for="city">Kota</label>
      <select id="city">
        <option value="">Semua kota</option>
        <option>Surabaya</option><option>Bali</option><option>Malang</option>
      </select></div>
    <div class="f"><label for="checkin">Check-in</label><input type="date" id="checkin" required></div>
    <div class="f"><label for="checkout">Check-out</label><input type="date" id="checkout" required></div>
    <button class="go" id="goBtn" type="submit">Cari kamar</button>
  </form>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</div></section>

<section class="sec"><div class="wrap">
  <div class="sec-h"><h2 id="listTitle">Semua kamar</h2><span class="count" id="count"></span></div>
  <ul class="rooms" id="rooms"></ul>
</div></section>

<section class="sec"><div class="wrap">
  <div class="mine">
    <h2>Pemesananku</h2>
    <form class="lookup" id="lookupForm">
      <input id="bkId" inputmode="numeric" placeholder="Nomor pemesanan" aria-label="Nomor pemesanan" required>
      <button class="btn solid" type="submit">Cek pemesanan</button>
    </form>
    <div id="bkResult"></div>
  </div>
</div></section>
</main>

<footer><div class="wrap">HotelKu menggabungkan data dari Hotel A dan Hotel B lewat API.</div></footer>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>

<script>
const API = '/api';
const $ = s => document.querySelector(s);
const rupiah = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = (o, keys, d='') => { for (const k of keys) if (o && o[k] != null && o[k] !== '') return o[k]; return d; };

async function call(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Accept':'application/json', ...(opts.body ? {'Content-Type':'application/json'} : {}) }
  });
  let json = null;
  try { json = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, json };
}

/* Menyeragamkan satu kamar dari respons HotelKu.
   Kalau nama field di API-mu berbeda, ubah daftar kunci di bawah ini. */
function normalize(r) {
  const hotelRaw = String(pick(r, ['hotel','hotel_code','source','hotel_id','sumber'], '?'));
  const code = /b$/i.test(hotelRaw.trim()) ? 'B' : /a$/i.test(hotelRaw.trim()) ? 'A' : hotelRaw.trim().slice(0,1).toUpperCase();
  return {
    raw: r,
    hotel: code,
    hotelName: pick(r, ['hotel_name','nama_hotel'], 'Hotel ' + code),
    id: pick(r, ['room_id','id_kamar','id']),
    name: pick(r, ['room_name','nama_kamar','name','nama'], 'Kamar'),
    city: pick(r, ['city','kota'], ''),
    price: Number(pick(r, ['price_per_night','price','harga_per_malam','harga'], 0)),
    capacity: pick(r, ['capacity','kapasitas'], '')
  };
}
function listFrom(json) {
  if (!json) return [];
  const d = json.data ?? json.rooms ?? json.results ?? json;
  return Array.isArray(d) ? d : [];
}

let rooms = [];
const nights = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 86400000));
const isoDay = off => { const d = new Date(); d.setDate(d.getDate() + off); return d.toISOString().slice(0,10); };

function setStatus(msg, cls='') { const s = $('#status'); s.textContent = msg; s.className = 'status ' + cls; }

function render(title) {
  $('#listTitle').textContent = title;
  $('#count').textContent = rooms.length ? rooms.length + ' kamar' : '';
  const ul = $('#rooms');
  if (!rooms.length) { ul.innerHTML = '<li class="empty">Belum ada kamar yang cocok. Coba ubah kota atau tanggalnya.</li>'; return; }
  const n = nights($('#checkin').value, $('#checkout').value);
  ul.innerHTML = rooms.map((r, i) => `
    <li class="room">
      <div class="tag ${r.hotel === 'B' ? 'b' : ''}" title="${esc(r.hotelName)}">${esc(r.hotel)}</div>
      <div><h3>${esc(r.name)}</h3>
        <div class="meta">${esc(r.hotelName)}${r.city ? ' · ' + esc(r.city) : ''}${r.capacity ? ' · ' + esc(r.capacity) + ' tamu' : ''}</div></div>
      <div class="price"><strong>${rupiah(r.price)}</strong><small>${n > 0 ? 'per malam, total ' + rupiah(r.price * n) : 'per malam'}</small></div>
      <button class="btn" data-i="${i}">Pesan</button>
    </li>`).join('');
}

async function loadAll() {
  setStatus('Memuat semua kamar...');
  const r = await call('/hotels');
  if (!r.ok) { setStatus('Tidak bisa memuat kamar. Pastikan hotel-a dan hotel-b sudah berjalan, lalu muat ulang halaman.', 'bad'); rooms = []; render('Semua kamar'); return; }
  rooms = listFrom(r.json).map(normalize);
  setStatus(rooms.length ? '' : 'Data kamar kosong. Cek apakah hotel-a (8001) dan hotel-b (8002) sudah menyala.', rooms.length ? '' : 'warn');
  render('Semua kamar');
}

$('#searchForm').addEventListener('submit', async e => {
  e.preventDefault();
  const ci = $('#checkin').value, co = $('#checkout').value, city = $('#city').value;
  if (nights(ci, co) < 1) { setStatus('Tanggal check-out harus setelah check-in.', 'bad'); return; }
  const btn = $('#goBtn'); btn.disabled = true; btn.textContent = 'Mencari...';
  const q = new URLSearchParams({ checkin: ci, checkout: co }); if (city) q.set('city', city);
  const r = await call('/search?' + q);
  btn.disabled = false; btn.textContent = 'Cari kamar';
  if (!r.ok) { setStatus(r.status === 422 ? 'Isi kota dan tanggal dengan benar.' : 'Pencarian gagal. Coba lagi sebentar.', 'bad'); return; }
  rooms = listFrom(r.json).map(normalize);
  const present = new Set(rooms.map(x => x.hotel));
  const missing = ['A','B'].filter(h => !present.has(h));
  if (rooms.length && missing.length) setStatus('Hotel ' + missing.join(' dan ') + ' tidak menampilkan kamar. Bisa jadi penuh di tanggal itu atau sedang tidak terhubung.', 'warn');
  else setStatus('');
  render('Kamar kosong' + (city ? ' di ' + city : ''));
});

/* dialog pemesanan */
const dlg = $('#dlg');
$('#rooms').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  openBooking(rooms[+b.dataset.i]);
});

function openBooking(r) {
  const ci = $('#checkin').value || isoDay(1), co = $('#checkout').value || isoDay(3);
  dlg.innerHTML = `
  <form id="bkForm">
    <h2 id="dlgTitle">Pesan kamar</h2>
    <p class="sum">${esc(r.name)} · ${esc(r.hotelName)}${r.city ? ', ' + esc(r.city) : ''}</p>
    <div class="fld"><label for="gn">Nama tamu</label><input id="gn" required autocomplete="name"></div>
    <div class="fld"><label for="ge">Email</label><input id="ge" type="email" required autocomplete="email"></div>
    <div class="two">
      <div class="fld"><label for="bci">Check-in</label><input id="bci" type="date" value="${ci}" required></div>
      <div class="fld"><label for="bco">Check-out</label><input id="bco" type="date" value="${co}" required></div>
    </div>
    <div class="total"><span class="meta" id="nn"></span><strong id="tt"></strong></div>
    <p class="err" id="bkErr" role="alert"></p>
    <div class="acts"><button type="button" class="btn" id="cancelDlg">Batal</button><button class="btn solid" id="sendBk" type="submit">Pesan sekarang</button></div>
  </form>`;
  const upd = () => { const n = nights($('#bci').value, $('#bco').value); $('#nn').textContent = n > 0 ? n + ' malam' : 'Tanggal belum valid'; $('#tt').textContent = rupiah(r.price * n); };
  $('#bci').oninput = $('#bco').oninput = upd; upd();
  $('#cancelDlg').onclick = () => dlg.close();
  $('#bkForm').onsubmit = async ev => {
    ev.preventDefault();
    const a = $('#bci').value, z = $('#bco').value;
    if (nights(a, z) < 1) { $('#bkErr').textContent = 'Check-out harus setelah check-in.'; return; }
    const send = $('#sendBk'); send.disabled = true; send.textContent = 'Memproses...';
    const res = await call('/bookings', { method:'POST', body: JSON.stringify({
      hotel: r.hotel, room_id: r.id, guest_name: $('#gn').value.trim(), guest_email: $('#ge').value.trim(), checkin: a, checkout: z }) });
    send.disabled = false; send.textContent = 'Pesan sekarang';
    if (res.status === 409) { $('#bkErr').textContent = 'Kamar ini sudah terpesan di tanggal itu. Pilih tanggal lain.'; return; }
    if (res.status === 422) { const m = res.json && res.json.errors ? Object.values(res.json.errors).flat().join('\n') : 'Data belum lengkap.'; $('#bkErr').textContent = m; return; }
    if (!res.ok) { $('#bkErr').textContent = 'Pemesanan gagal. Pastikan ' + r.hotelName + ' sedang berjalan, lalu coba lagi.'; return; }
    const b = res.json.data ?? res.json;
    const id = pick(b, ['id','booking_id']);
    dlg.innerHTML = `<div class="done"><h2 class="ok">Pemesanan berhasil</h2>
      <p class="sum">Simpan nomor ini untuk mengecek atau membatalkan pemesanan.</p>
      <div class="bk"><dl><dt>Nomor</dt><dd>${esc(id)}</dd><dt>Kamar</dt><dd>${esc(r.name)} (${esc(r.hotelName)})</dd><dt>Tanggal</dt><dd>${esc(a)} sampai ${esc(z)}</dd><dt>Total</dt><dd>${rupiah(pick(b, ['total_price','total','total_harga'], r.price * nights(a, z)))}</dd></dl></div>
      <div class="acts" style="margin-top:16px"><button class="btn solid" id="closeDone">Tutup</button></div></div>`;
    $('#closeDone').onclick = () => dlg.close();
    $('#bkId').value = id;
  };
  dlg.showModal();
}

/* cek dan batalkan pemesanan */
$('#lookupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#bkId').value.trim();
  const out = $('#bkResult'); out.innerHTML = '<p class="meta">Mencari...</p>';
  const r = await call('/bookings/' + encodeURIComponent(id));
  if (r.status === 404) { out.innerHTML = '<p class="meta">Nomor pemesanan tidak ditemukan.</p>'; return; }
  if (!r.ok) { out.innerHTML = '<p class="err">Gagal mengambil pemesanan. Coba lagi.</p>'; return; }
  const b = r.json.data ?? r.json;
  const rows = [['Nomor', pick(b, ['id','booking_id'], id)], ['Tamu', pick(b, ['guest_name'])], ['Hotel', pick(b, ['hotel','hotel_name'])],
    ['Tanggal', pick(b, ['checkin']) + ' sampai ' + pick(b, ['checkout'])], ['Total', rupiah(pick(b, ['total_price','total'], 0))], ['Status', pick(b, ['status'], 'terkonfirmasi')]]
    .filter(x => x[1] && x[1] !== ' sampai ');
  out.innerHTML = `<div class="bk"><dl>${rows.map(x => `<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl><button class="btn danger" id="cancelBk">Batalkan pemesanan</button></div>`;
  $('#cancelBk').onclick = async () => {
    if (!confirm('Batalkan pemesanan nomor ' + id + '?')) return;
    const d = await call('/bookings/' + encodeURIComponent(id), { method: 'DELETE' });
    out.innerHTML = d.ok ? '<p class="ok"><strong>Pemesanan dibatalkan.</strong> Kamar bisa dipesan lagi.</p>' : '<p class="err">Pembatalan gagal. Coba lagi.</p>';
  };
});

$('#checkin').min = $('#checkout').min = isoDay(0);
$('#checkin').value = isoDay(1); $('#checkout').value = isoDay(3);
loadAll();
</script>
</body>
</html>
